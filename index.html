<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.cdnfonts.com/css/minecrafter" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minecraft: Mounts of Mayhem - Cuenta Regresiva</title>
<style>
    body {
        background: #0e0e0e;
        color: white;
        margin: 0;
        padding: 0;
        font-family: 'Minecrafter', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
    }
    .title {
        font-size: 9vw;
        text-align: center;
        background: linear-gradient(to bottom, #ffe066, #ff9b00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0px 4px 0px #5a4500, 0px 6px 0px #000;
        margin-bottom: 20px;
    }
    .countdown-box {
        padding: 25px;
        background: #222;
        border: 4px solid #000;
        position: relative;
        width: 90%;
        max-width: 380px;
        text-align: center;
        box-shadow: 
            0px 0px 0px 6px #555, 
            0px 0px 0px 10px #000;
    }
    .count-item {
        font-size: 12vw;
        margin: 10px 0 0 0;
    }
    .label {
        font-size: 4vw;
        color: white;
        margin-bottom: 15px;
    }
    .finished {
        font-size: 6vw;
        color: #00e600;
        margin-top: 20px;
        text-shadow: 0px 3px 0px #003300;
    }
</style>
</head>
<body>

<div class="title">Minecraft: Mounts of Mayhem</div>

<div class="countdown-box">
    <div class="label" id="days-label">Días</div>
    <div class="count-item" id="days">0</div>

    <div class="label" id="hours-label">Horas</div>
    <div class="count-item" id="hours">0</div>

    <div class="label" id="minutes-label">Minutos</div>
    <div class="count-item" id="minutes">0</div>

    <div class="label" id="seconds-label">Segundos</div>
    <div class="count-item" id="seconds">0</div>

    <div id="finish-message" class="finished" style="display:none;">
        ¡Minecraft: Mounts of Mayhem ya está disponible!
    </div>
</div>

<script>
    const targetDate = new Date("December 9, 2025 12:00:00").getTime();

    function playBeep() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.value = 880;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
    }

    let played = false;

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance <= 0) {
            if (!played) {
                playBeep();
                played = true;
            }

            document.getElementById("days").style.display = "none";
            document.getElementById("hours").style.display = "none";
            document.getElementById("minutes").style.display = "none";
            document.getElementById("seconds").style.display = "none";

            document.getElementById("days-label").style.display = "none";
            document.getElementById("hours-label").style.display = "none";
            document.getElementById("minutes-label").style.display = "none";
            document.getElementById("seconds-label").style.display = "none";

            document.getElementById("finish-message").style.display = "block";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = days;
        document.getElementById("hours").textContent = hours;
        document.getElementById("minutes").textContent = minutes;
        document.getElementById("seconds").textContent = seconds;
    }

    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
